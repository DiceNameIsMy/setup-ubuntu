#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Storage location is set by UPLOAD_LOCATION in the .env file; it is
      # bound via the named volume at the bottom of this file rather than a
      # plain bind mount, so a missing HDD is a hard error (see there).
      - immich-library:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: on-failure
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: on-failure

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Storage location is set by DB_DATA_LOCATION in the .env file; bound
      # via the named volume at the bottom of this file, same as the library.
      - immich-db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: on-failure
    healthcheck:
      disable: false

# These are bind mounts expressed as named volumes on purpose. A plain
# `- ${UPLOAD_LOCATION}:/data` bind makes Docker *create* the path if it's
# missing, so with the HDD unmounted the stack happily starts and writes a
# second, empty library onto the Pi's SD card. The local driver with
# o=bind refuses to start the container when `device` doesn't exist, which
# is what we want: no mount, no start.
#
# Combined with `restart: on-failure` (not `always`), this keeps systemd in
# charge of startup. With `always`, dockerd resurrects the stack at boot
# regardless of immich.service, defeating its RequiresMountsFor= guard.
#
# Note: these volumes cache their device path at creation time. After
# changing UPLOAD_LOCATION/DB_DATA_LOCATION in .env, recreate them:
#   docker compose down && docker volume rm immich_immich-library immich_immich-db
volumes:
  immich-library:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${UPLOAD_LOCATION}
  immich-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_DATA_LOCATION}
