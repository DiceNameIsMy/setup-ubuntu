# Isolated restore check: no production container names, networks, or volumes.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - type: bind
        source: ${UPLOAD_LOCATION}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:2284:2283'
    depends_on:
      - redis
      - database
  redis:
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${RESTORE_ADMIN:-verify_admin}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - verify-db:/var/lib/postgresql/data
    shm_size: 128mb
volumes:
  verify-db:
